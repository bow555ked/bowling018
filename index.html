<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของ นางสาวสุชาวดี อ่อเขนย (โบว์วี่)</title>
    <!-- เรียกใช้งาน Google Fonts (Kanit) เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 25px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .profile-header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            padding: 40px 20px 30px;
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            background-color: #fff;
        }

        .profile-body {
            padding: 25px 30px 35px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .profile-nickname {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .skill-badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        .bio-section {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            border-top: 1px dashed #e2e8f0;
            padding-top: 18px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar-container">
                <!-- รูปการ์ตูนเด็กผู้หญิงมัดผมหางม้าน่ารักๆ -->
                <img class="avatar" src="kk/nn.png" alt="รูปโปรไฟล์โบว์วี่">
            </div>
        </div>
        <div class="profile-body">
            <h1 class="profile-name">นางสาวสุชาวดี อ่อเขนย</h1>
            <p class="profile-nickname">ชื่อเล่น: โบว์วี่</1>
            
            <div class="skill-badge">
                🎤 ความสามารถพิเศษ: ร้องเพลง
            </div>

            <p class="bio-section">
                ยินดีที่ได้รู้จักทุกคนค่ะ! ชื่นชอบการร้องเพลง ถ่ายทอดอารมณ์ผ่านเสียงเพลง และรักดนตรีเป็นชีวิตจิตใจ ✨
            </p>
        </div>
    </div>

</body>
</html>
